# Views of a 3D QGT run (needs trimesh: pip install -e ".[plot3d]").
# Run: python scripts/plot/qgt_3d.py [config]
# Calls qgt.plotting.qgt_3d.<function>(**arguments).
# The previous script had every call below commented out; the last one is active here.

function = "plot_3d_qgt"

[arguments]
results_dir = "@legacy/3D_QGT_results/gWaveAltermagnetHamiltonian/data_set_6"
quantity = "berry"
count = 2
bands = [1, 2, 3, 4]
plot_step_size = 1
kz_range = [-3.14, 3.14]

