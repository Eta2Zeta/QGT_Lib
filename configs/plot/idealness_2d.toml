# Std of a QGT quantity over k versus V and signed 1/omega, left and right drive joined.
# Run: python scripts/plot/idealness_2d.py [config]
# Calls qgt.plotting.idealness_2d.<function>(**arguments).

function = "plot_qgt_std_param2d_signed_invomega_joined"

[arguments]
# Full rhombohedral graphene (chiral) Hamiltonian, left and right drive.
left_result_dir = "@legacy/2D_QGT_ND/LegacyWithN>1D/ChiralHamiltonian/A0_0.10-a_1.00-analytic_magnus_False-eta_1.00-magnus_order_1-n_5-omega_6.28-polarization_left-t1_355.16-vF_542.10-RANGES_V_-10.000_50.000-omega_50.000_5000.000_-SPACING_V_48_linear-omega_32_linear_-kx-0.90_0.90__ky-0.90_0.90__mesh100_data_set1"
right_result_dir = "@legacy/2D_QGT_ND/LegacyWithN>1D/ChiralHamiltonian/A0_0.10-a_1.00-analytic_magnus_False-eta_1.00-magnus_order_1-n_5-omega_6.28-polarization_right-t1_355.16-vF_542.10-RANGES_V_-10.000_50.000-omega_50.000_5000.000_-SPACING_V_48_linear-omega_32_linear_-kx-0.90_0.90__ky-0.90_0.90__mesh100_data_set1"
y_param = "V"            # the shared second parameter
quantity = "trace"       # "trace" | "berry" | "trace_minus_berry" | "chern"
drop_overlap = true      # typical when both include the same max omega

# Other calls previously kept in the script:
#   quantity = "berry", "trace_minus_berry" or "chern" on the same datasets, with show = true.
#   Chiral projected Hamiltonian (these folders no longer exist under legacy/):
#     QGT_ND/RhombohedralGrapheneHamiltonian/A0_0.10-V_30-...-polarization_left-...-RANGES_V_-10.000_50.000-omega_20.000_5000.000_-SPACING_V_32_linear-omega_48_linear_-kx-0.90_0.90__ky-0.90_0.90__mesh100_data_set1
#     and the matching polarization_right folder; quantity "trace", "berry" or "trace_minus_berry", show = false.
#   function = "plot_slices_qgt_std_param2d_signed_invomega_joined" on the full Hamiltonian datasets,
#     slice_y_val = 20.0, slice_omega_val = 100.0, y_param = "V", quantity = "berry",
#     export_slice_path = "@legacy/1D_idealness_resutls/slice_data_export.npz", show = false
#     (its export is the input of compute/fit_idealness_1d).
