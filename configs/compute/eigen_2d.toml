# Eigenvalues on a 2D k-grid. Writes an eigen_2d run, which qgt_2d and spin_density read.
# Run: python scripts/compute/eigen_2d.py [config]
# Calls qgt.workflows.eigen_2d.calculation_2d(model, **arguments).

# Matches the legacy run results/2D_QGT_results/MinimalHamSG1272a2b/dataset_3.
[model]
class = "MinimalHamSG127_2a2b"

[model.params]
Jx = 0.0
Jy = 0.0
Jz = 0.2
lamb = 0.1
lamb_z = 0.1
mu = 0.0
omega = 0.0
A0 = 0.0
polarization = "left"
magnus_order = 1
analytic_magnus = false
t1 = 0.8
t2 = 0.2
t3 = 0.3
t4 = 0.3

[arguments]
force_new = true
include_end_points = false
kk = 0.031415926535897934   # 0.01 π
order = "xyz"
mesh_spacing = 150
k_max = 3.204424506661589   # 1.02 π: interior samples reach ±3.162, beyond the BZ edges at ±π

# Other setups previously kept in the script (replace [model] / [arguments] to use one):
#
#   THF_Hamiltonian with A0 = 0, V = 5; arguments force_new = false,
#   include_end_points = false, kk = 0.0, order = "xyz".
#
#   MinimalHamSG194_2a with Jx = 0.0, Jy = 0.0, Jz = 0.2, lamb = 0.1, lamb_z = 0.5,
#   A0 = 0.0, magnus_order = 0, t1 = t2 = t3 = t4 = 0.3.
#
#   MinimalHamSG127_2c2d, or MinimalHamSG124_2b2d, with Jx = 0.0, Jy = 0.0, Jz = 0.2,
#   lamb = 0.1, lamb_z = 0.1, A0 = 0.0, t1 = t2 = t3 = t4 = 0.3.
