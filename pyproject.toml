[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qgt-lib"
version = "0.1.14"
description = "Quantum geometric tensor, Berry curvature and band-structure calculations for tight-binding and Floquet Hamiltonians"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "plotly",
    "sympy",
    "tqdm",
    "qutip",
    "scikit-image",
]

[project.optional-dependencies]
dev = ["pytest"]
# Only Plot_QGT_3D.py needs trimesh.
plot3d = ["trimesh"]

[tool.setuptools.packages.find]
include = ["qgt*", "Library*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
